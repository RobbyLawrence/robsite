<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Non-functional UI demo of the EECS Checkout login screen.">
  <link rel="icon" href="/favicon.ico">
  <title>EECS Checkout — UI Demo</title>
  <style>
    /* Resolved from the live Chakra UI theme (chakra defaults). Demo mockup only. */
    :root {
      --chakra-fonts-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      --gray-100: #EDF2F7;
      --gray-200: #E2E8F0;
      --gray-300: #CBD5E0;
      --gray-800: #1A202C;
      --blue-500: #3182ce;
      --ring: 0 0 0 3px rgba(66, 153, 225, 0.6);
      --input-height: 2.5rem; /* chakra sizes.10 */
    }
    * { box-sizing: border-box; border: 0 solid var(--gray-200); }
    html, body { margin: 0; }
    body {
      font-family: var(--chakra-fonts-body);
      color: var(--gray-800);
      background: #fff;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* .css-1811skr + the inline style the app applies to the outer VStack */
    .stack-outer {
      display: flex; flex-direction: column; gap: 1rem; /* space.4 */
      align-items: center; justify-content: center;
      height: 100vh;
    }

    /* .css-1dklj6k (chakra-heading) */
    .heading {
      margin: 0;
      font-weight: 700;              /* bold */
      font-size: 1.875rem;           /* 3xl */
      line-height: 1.33;
    }
    @media screen and (min-width: 48em) {
      .heading { font-size: 2.25rem; line-height: 1.2; } /* 4xl */
    }

    /* .css-8g8ihq (inner form VStack) */
    .stack-form { display: flex; flex-direction: column; gap: 0.5rem; }

    /* .css-1kxonj9 (FormControl) */
    .form-control { width: 100%; position: relative; }

    /* shared underline-input look (.css-1xzh7hy / .css-vyx8vp) */
    .input {
      width: 30em;
      max-width: 100%;               /* guard so the demo doesn't overflow narrow screens */
      height: var(--input-height);
      font-size: 1rem;               /* md */
      padding-inline: 0;
      border-radius: 0;
      background: transparent;
      border-bottom: 1px solid var(--gray-200);
      outline: transparent solid 2px; outline-offset: 2px;
      appearance: none;
      transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
      transition-duration: 200ms;
    }
    .input:focus-visible {
      border-color: var(--blue-500);
      box-shadow: var(--blue-500) 0px 1px 0px 0px;
    }

    /* .css-3y1kv3 (InputGroup) */
    .input-group { width: 30em; max-width: 100%; display: flex; position: relative; isolation: isolate; }
    .input-group .input { width: 100%; padding-right: 4.5em; } /* .css-vyx8vp */

    /* .css-5vcxqh (InputRightElement) */
    .input-right {
      position: absolute; top: 0; right: 0; z-index: 2;
      height: var(--input-height); width: 4.5em;
      display: flex; align-items: center; justify-content: center;
    }

    /* .css-1itct28 (Show button) */
    .show-btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 1.75em; min-width: 2rem;              /* sizes.8 */
      padding-inline: 0.75rem;                       /* space.3 */
      font-size: 0.875rem; font-weight: 600;         /* sm / semibold */
      line-height: 1.2; border-radius: 0.375rem;     /* md */
      background: var(--gray-100); color: var(--gray-800);
      cursor: pointer; white-space: nowrap; user-select: none;
      transition-property: background-color, border-color, color, box-shadow; transition-duration: 200ms;
    }
    .show-btn:hover { background: var(--gray-200); }
    .show-btn:active { background: var(--gray-300); }
    .show-btn:focus-visible { box-shadow: var(--ring); outline: none; }

    /* .css-wm6y6a (Login button — gray, full width) */
    .login-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; height: var(--input-height); min-width: var(--input-height);
      padding-inline: 1rem;                          /* space.4 */
      font-size: 1rem; font-weight: 600; line-height: 1.2;
      border-radius: 0.375rem;
      background: var(--gray-100); color: var(--gray-800);
      cursor: pointer; white-space: nowrap; user-select: none;
      transition-property: background-color, border-color, color, box-shadow; transition-duration: 200ms;
    }
    .login-btn:hover { background: var(--gray-200); }
    .login-btn:active { background: var(--gray-300); }
    .login-btn:focus-visible { box-shadow: var(--ring); outline: none; }

    .notice { margin: 0.25rem 0 0; min-height: 1.25rem; font-size: 0.875rem; color: #718096; text-align: center; }
  </style>
</head>
<body class="chakra-ui-light">

  <div class="stack-outer">
    <h2 class="heading">Log in with NetID</h2>
    <form id="login-form" autocomplete="off" novalidate>
      <div class="stack-form">
        <div class="form-control">
          <input class="input" id="netid" type="text" placeholder="NetID" aria-label="NetID">
        </div>
        <div class="form-control">
          <div class="input-group">
            <input class="input" id="password" type="password" placeholder="Password" aria-label="Password">
            <div class="input-right">
              <button type="button" class="show-btn" id="toggle-pw" aria-label="Show password">Show</button>
            </div>
          </div>
        </div>
        <button type="submit" class="login-btn">Login</button>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </div>
    </form>
  </div>

  <script>
    // Demo only: never submit, never store, never transmit.
    (function () {
      var form = document.getElementById('login-form');
      var notice = document.getElementById('notice');
      var pw = document.getElementById('password');
      var toggle = document.getElementById('toggle-pw');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        notice.textContent = 'Get pwned.';
      });

      toggle.addEventListener('click', function () {
        var showing = pw.type === 'text';
        pw.type = showing ? 'password' : 'text';
        toggle.textContent = showing ? 'Show' : 'Hide';
        toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    })();
  </script>
</body>
</html>
